baseURL = "https://moorelab.dev/"
locale = "en-us"
title = "MooreLab"
theme = "PaperMod"
[pagination]
  pagerSize = 10
enableRobotsTXT = true
buildDrafts = false

[params]
  author = "Jordan Moore"
  description = "Home server infrastructure, dev tooling, and lab notes."
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  defaultTheme = "dark"

  [params.profileMode]
    enabled = true
    title = "Jordan Moore"
    subtitle = "Cloud Platform Engineer — Kubernetes, AWS/GCP, and infrastructure automation."

    [[params.profileMode.buttons]]
      name = "Blog"
      url = "/blog"

    [[params.profileMode.buttons]]
      name = "Lab"
      url = "/lab"

    [[params.profileMode.buttons]]
      name = "GitHub"
      url = "https://github.com/jordanbecketmoore/"

    [[params.profileMode.buttons]]
      name = "LinkedIn"
      url = "https://www.linkedin.com/in/jordan-moore-4aa009226/"

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 10

[[menu.main]]
  name = "Lab"
  url = "/lab/"
  weight = 20

[[menu.main]]
  name = "Links"
  url = "/links/"
  weight = 30

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 40

[taxonomies]
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]
